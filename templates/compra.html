<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <form action="/guardar_compra">
        <h1>Calculadora de compras y cuota mensual</h1>
        <p>
            Ingrese los datos de la compra que está realizando y haga click en el botón Guardar
        </p>
        <div>
            Número de la tarjeta: <input type="text" name="numero_tarjeta" />
        </div>
        <div>
            Valor de la compra: <input type="number" name="compra" />
        </div>
        <div>
            Numéro de Cuotas: <input type="number" name="cuotas" />
        </div>
        <div>
            Tasa de Interés: <input type="number" name="tasa" />
        </div>

        <input type="submit" value="Calcular Cuota y Guardar" />
    </form>
</body>

</html>
